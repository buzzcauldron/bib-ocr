[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bib-ocr"
version = "0.1.0"
description = "Bibliography-oriented PDF citation extractor: hyperlinks → DOI scan → ref-section OCR → footnotes → inline crawl"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.23",
    "pypdf>=4.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16",
    "Pillow>=10.0",
    "regex>=2023.0",
    "bibtexparser>=1.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=8", "coverage", "ruff", "matplotlib>=3.7"]

[project.scripts]
bib-ocr = "bib_ocr.cli:main"

[project.urls]
Homepage = "https://github.com/buzzcauldron/bib-ocr"
Repository = "https://github.com/buzzcauldron/bib-ocr"
"Research Party" = "https://github.com/buzzcauldron/research-party"

[tool.setuptools.packages.find]
where = ["."]
include = ["bib_ocr*"]
