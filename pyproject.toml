[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bib-ocr"
version = "0.1.0"
description = "Bibliography-oriented PDF citation extractor: hyperlinks → DOI scan → ref-section OCR → footnotes → inline crawl"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.23",
    "pypdf>=4.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16",
    "Pillow>=10.0",
    "regex>=2023.0",
    "bibtexparser>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "coverage", "ruff"]

[project.scripts]
bib-ocr = "bib_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bib_ocr*"]
